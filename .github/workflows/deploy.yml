name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_STAGE: /var/www/portfolio/Portfolio/.astro/deploy-upload-${{ github.run_id }}-${{ github.run_attempt }}
      POCKETBASE_URL: https://pb.melvyn-philippon.fr
      SITE_URL: https://portfolio.melvyn-philippon.fr

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Préparer la connexion SSH
        id: ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          mkdir -p "$RUNNER_TEMP/portfolio-ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$RUNNER_TEMP/portfolio-ssh/key"

          ssh-keyscan -T 15 -p "$SSH_PORT" "$SSH_HOST" \
            > "$RUNNER_TEMP/portfolio-ssh/known_hosts" \
            2> "$RUNNER_TEMP/portfolio-ssh/keyscan.log"

          test -s "$RUNNER_TEMP/portfolio-ssh/known_hosts"

          cat > "$RUNNER_TEMP/portfolio-ssh/ssh" <<'SH'
          #!/usr/bin/env bash
          exec ssh \
            -i "$RUNNER_TEMP/portfolio-ssh/key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/portfolio-ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" "$@"
          SH

          chmod 700 "$RUNNER_TEMP/portfolio-ssh/ssh"

      - name: Installer les dépendances sur GitHub
        run: bun ci

      - name: Récupérer les réglages privés du serveur
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/portfolio-config"

          "$RUNNER_TEMP/portfolio-ssh/ssh" '
            set -eu
            cd /var/www/portfolio/Portfolio
            for config in .env .env.local .env.production .env.production.local; do
              if [ -f "$config" ]; then
                printf "%s\n" "$config"
              fi
            done | tar --dereference -czf - -T -
          ' | tar --no-same-owner --no-same-permissions \
                -xzf - -C "$RUNNER_TEMP/portfolio-config"

          # Load only the public settings actually consumed by the site, with
          # production precedence. Never source server .env as shell code.
          node scripts/prepare-deploy-env.mjs \
            "$RUNNER_TEMP/portfolio-config" "$GITHUB_ENV"
          rm -rf -- "$RUNNER_TEMP/portfolio-config"

      - name: Vérifier PocketBase
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --output /dev/null \
            "$POCKETBASE_URL/api/health"

      - name: Compiler et vérifier le site sur GitHub
        env:
          NODE_ENV: production
        shell: bash
        run: |
          set -euo pipefail
          bun run --bun build --outDir .astro/deploy-dist
          bun run check:seo .astro/deploy-dist
          bash scripts/deploy-static.sh validate .astro/deploy-dist

      - name: Transférer le site terminé sur le VPS
        shell: bash
        run: |
          set -euo pipefail

          "$RUNNER_TEMP/portfolio-ssh/ssh" \
            "bash -s -- prepare '$DEPLOY_STAGE'" < scripts/deploy-static.sh
          tar -C .astro/deploy-dist -czf - . |
            "$RUNNER_TEMP/portfolio-ssh/ssh" \
              "tar --no-same-owner --no-same-permissions -xzf - -C '$DEPLOY_STAGE/dist'"

      - name: Publier et vérifier le site
        shell: bash
        run: |
          set -euo pipefail

          "$RUNNER_TEMP/portfolio-ssh/ssh" \
            "bash -s -- publish '$DEPLOY_STAGE'" < scripts/deploy-static.sh

      - name: Nettoyer le transfert temporaire sur le VPS
        if: ${{ always() && steps.ssh.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/portfolio-ssh/ssh" \
            "bash -s -- cleanup '$DEPLOY_STAGE'" < scripts/deploy-static.sh

      - name: Supprimer la clé et la configuration du runner
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          rm -rf -- "$RUNNER_TEMP/portfolio-ssh" "$RUNNER_TEMP/portfolio-config"
