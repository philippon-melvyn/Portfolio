name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Déployer le portfolio sur le VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          script: |
            set -e

            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"

            cd /var/www/portfolio/Portfolio

            git pull origin main
            bun ci

            # PocketBase or configuration errors must not erase the live dist.
            bun run --bun build --outDir .astro/deploy-dist
            bun run check:seo .astro/deploy-dist

            # Promote only a complete, checked build; restore on a failed swap.
            # All paths are relative to /var/www/portfolio/Portfolio above.
            if [ -e .astro/deploy-previous ]; then
              echo "Backup .astro/deploy-previous exists: inspect it before deploying."
              exit 1
            fi
            if [ -d dist ]; then mv dist .astro/deploy-previous; fi
            if ! mv .astro/deploy-dist dist; then
              if [ -d .astro/deploy-previous ]; then mv .astro/deploy-previous dist; fi
              exit 1
            fi
            if ! curl --fail --output /dev/null https://portfolio.melvyn-philippon.fr/; then
              mv dist .astro/deploy-dist
              if [ -d .astro/deploy-previous ]; then mv .astro/deploy-previous dist; fi
              exit 1
            fi
            if [ -d .astro/deploy-previous ]; then rm -r -- .astro/deploy-previous; fi
