name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Déployer le portfolio sur le VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          script: |
            set -e

            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"

            deploy_root=/var/www/portfolio/Portfolio
            cd "$deploy_root"
            mkdir -p .astro

            # Bun also reads ancestor package.json files. Build outside the old
            # VPS tree so neither its corrupt Git objects nor manifests are read.
            deploy_source=$(mktemp -d /tmp/portfolio-deploy-source.XXXXXX)
            deploy_stage=
            cleanup_source() {
              case "$deploy_source" in
                /tmp/portfolio-deploy-source.*) rm -rf -- "$deploy_source" ;;
              esac
              case "$deploy_stage" in
                "$deploy_root"/.astro/deploy-stage.*) rm -rf -- "$deploy_stage" ;;
              esac
            }
            trap cleanup_source EXIT
            git clone --depth 1 --single-branch --branch main \
              https://github.com/philippon-melvyn/Portfolio.git "$deploy_source"
            git -C "$deploy_source" fsck --full

            # Keep server configuration private; never overwrite it or pb_data.
            for config in .env .env.local .env.production .env.production.local; do
              if [ -f "$deploy_root/$config" ]; then
                cp -- "$deploy_root/$config" "$deploy_source/$config"
              fi
            done
            (
              cd "$deploy_source"
              bun ci
              bun run --bun build --outDir .astro/deploy-dist
              bun run check:seo .astro/deploy-dist
            )

            if [ ! -f "$deploy_source/.astro/deploy-dist/index.html" ]; then
              echo "Build output is incomplete; the live site has not been changed."
              exit 1
            fi

            # /tmp may be on another filesystem. Finish the copy before moving
            # the live site; the final rename then stays on the same filesystem.
            deploy_stage=$(mktemp -d "$deploy_root/.astro/deploy-stage.XXXXXX")
            cp -a -- "$deploy_source/.astro/deploy-dist" "$deploy_stage/dist"

            # Promote only a complete, checked build; restore on a failed swap.
            # All paths are relative to /var/www/portfolio/Portfolio above.
            if [ -e .astro/deploy-previous ]; then
              echo "Backup .astro/deploy-previous exists: inspect it before deploying."
              exit 1
            fi
            if [ -d dist ]; then mv dist .astro/deploy-previous; fi
            if ! mv "$deploy_stage/dist" dist; then
              if [ -d .astro/deploy-previous ]; then mv .astro/deploy-previous dist; fi
              exit 1
            fi
            if ! curl --fail --connect-timeout 10 --max-time 30 --output /dev/null https://portfolio.melvyn-philippon.fr/; then
              mv dist "$deploy_stage/dist"
              if [ -d .astro/deploy-previous ]; then mv .astro/deploy-previous dist; fi
              exit 1
            fi
            if [ -d .astro/deploy-previous ]; then rm -r -- .astro/deploy-previous; fi
